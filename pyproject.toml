[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stabblediffusion"
version = "0.1.0"
description = "Stable Diffusion WebUI Colab setup utilities"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/stabblediffusion --cov-report=term-missing"

[tool.setuptools.packages.find]
where = ["src"]
